name: format-aipb-once

on:
  push:
    branches:
      - 'ai/phase-06-inference'

permissions:
  contents: write

jobs:
  format:
    name: Apply clang-format 23.1.0
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pre-commit
        run: python3 -m pip install --user --disable-pip-version-check pre-commit

      - name: Format AiPB sources
        run: python3 -m pre_commit run --all-files

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- inc/ai src/ai tests/unit; then
            echo "No formatting changes required."
            exit 0
          fi

          git diff --check -- inc/ai src/ai tests/unit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inc/ai src/ai tests/unit
          git commit -m "style: format new AiPB sources"
          git push origin HEAD:${GITHUB_REF_NAME}
