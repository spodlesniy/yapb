name: build

on:
  push:
    branches:
      - master
      - dev
      - 'ai/**'
    paths-ignore:
      - '**.md'

  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select build target'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - windows-x86

  release:
    types: [published]

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: AI unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install build tools
        run: |
          python -m pip install --upgrade meson ninja
      - name: Configure test build
        run: meson setup unit-tests -D64bit=true -Dtests=true
      - name: Run unit tests
        run: |
          meson test -C unit-tests --print-errorlogs --verbose
          file unit-tests/yapb_ai_tests

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meson-test-logs
          path: unit-tests/meson-logs/testlog.txt

  changes:
    name: Detect conditional test changes
    runs-on: ubuntu-latest
    outputs:
      training-tools: ${{ steps.filter.outputs.training-tools }}
      onnx-runtime: ${{ steps.filter.outputs.onnx-runtime }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "release" ]]; then
            echo "training-tools=true" >> "$GITHUB_OUTPUT"
            echo "onnx-runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          echo "Changed paths:"
          printf '%s\n' "$changed_files"

          training_tools=false
          onnx_runtime=false

          while IFS= read -r file; do
            if [[ "$training_tools" == true && "$onnx_runtime" == true ]]; then
              break
            fi

            case "$file" in
              tools/aipb_training/*)
                training_tools=true
                ;;
            esac

            case "$file" in
              .github/workflows/build.yml|meson.build|meson_options.txt|\
              src/ai/ai_onnx_*.cpp|\
              inc/ai/ai_onnx_*.h|\
              tests/unit/ai_onnx_*.cpp|\
              src/ai/ai_inference_*.cpp|\
              inc/ai/ai_inference_*.h|\
              tests/unit/ai_inference_*.cpp|\
              tools/aipb_training/model_contract.py|\
              tools/aipb_training/feature_contract.py|\
              tools/aipb_training/onnx_export.py|\
              tools/aipb_training/export.py|\
              tools/aipb_training/policy_model.py|\
              tools/aipb_training/tests/test_model_contract.py|\
              tools/aipb_training/tests/test_feature_contract.py|\
              tools/aipb_training/tests/test_onnx_export.py|\
              tools/aipb_training/tests/test_export.py|\
              tools/aipb_training/tests/test_policy_model.py)
                onnx_runtime=true
                ;;
            esac
          done <<< "$changed_files"

          echo "training-tools=${training_tools}" >> "$GITHUB_OUTPUT"
          echo "onnx-runtime=${onnx_runtime}" >> "$GITHUB_OUTPUT"

  onnx-runtime-tests:
    name: ONNX Runtime AI tests
    needs: [unit-tests, changes]
    if: needs.changes.outputs.onnx-runtime == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Restore ONNX Runtime cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/aipb/onnxruntime
          key: aipb-onnxruntime-linux-x64-1.30.0-a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd

      - name: Install build tools
        run: |
          python -m pip install --upgrade meson ninja
      - name: Download or restore ONNX Runtime
        shell: bash
        env:
          ONNXRUNTIME_VERSION: '1.30.0'
          ONNXRUNTIME_SHA256: 'a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd'
        run: |
          set -euo pipefail
          cache_dir="${HOME}/.cache/aipb/onnxruntime"
          archive="onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          root="${archive%.tgz}"
          mkdir -p "${cache_dir}"

          if [[ ! -f "${cache_dir}/${archive}" || ! -d "${cache_dir}/${root}" ]]; then
            rm -f "${cache_dir}/${archive}"
            rm -rf "${cache_dir}/${root}"
            url="https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/${archive}"
            curl --fail --location --retry 3 --silent --show-error --output "${cache_dir}/${archive}" "${url}"
            echo "${ONNXRUNTIME_SHA256}  ${cache_dir}/${archive}" | sha256sum --check --strict
            tar -xzf "${cache_dir}/${archive}" -C "${cache_dir}"
          else
            echo "${ONNXRUNTIME_SHA256}  ${cache_dir}/${archive}" | sha256sum --check --strict
          fi

          rm -rf "${GITHUB_WORKSPACE}/${root}"
          cp -a "${cache_dir}/${root}" "${GITHUB_WORKSPACE}/${root}"
          echo "ONNXRUNTIME_ROOT=${root}" >> "$GITHUB_ENV"
      - name: Configure ONNX Runtime dependency
        shell: bash
        env:
          ONNXRUNTIME_VERSION: '1.30.0'
        run: |
          set -euo pipefail
          pkgconfig_dir="${RUNNER_TEMP}/pkgconfig"
          mkdir -p "${pkgconfig_dir}"
          cat > "${pkgconfig_dir}/onnxruntime.pc" <<EOF
          prefix=${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}
          exec_prefix=${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}
          libdir=${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}/lib
          includedir=${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}/include

          Name: onnxruntime
          Description: ONNX Runtime CPU release package
          Version: ${ONNXRUNTIME_VERSION}
          Libs: -L${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}/lib -lonnxruntime
          Cflags: -I${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}/include
          EOF
          echo "PKG_CONFIG_PATH=${pkgconfig_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/${ONNXRUNTIME_ROOT}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="${pkgconfig_dir}" pkg-config --modversion onnxruntime
      - name: Configure test build
        run: meson setup unit-tests-onnx -D64bit=true -Dtests=true -Donnxruntime=true
      - name: Run ONNX Runtime unit tests
        run: |
          meson test -C unit-tests-onnx --print-errorlogs --verbose
          file unit-tests-onnx/yapb_ai_tests
      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: onnxruntime-test-logs
          path: unit-tests-onnx/meson-logs/testlog.txt

  training-tools:
    name: Training tools tests
    needs: [unit-tests, changes]
    if: needs.unit-tests.result == 'success' && needs.changes.outputs.training-tools == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: tools/aipb_training/requirements.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade -r tools/aipb_training/requirements.txt
      - name: Run training tool tests
        run: |
          set -o pipefail
          python -m unittest discover -s tools/aipb_training/tests -t . -p 'test_*.py' 2>&1 | tee python-test.log

      - name: Upload Python Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-test-logs
          path: python-test.log

  bot-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_target == 'full'
    needs: [unit-tests]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yapb/builder:latest
      options: --hostname github-actions

    strategy:
      matrix:
        arch: ['linux-x86', 'linux-amd64', 'linux-x86-gcc', 'linux-x86-nosimd', 'linux-arm64', 'linux-riscv64', 'apple-x86', 'windows-x86-clang', 'windows-amd64', 'windows-x86-gcc']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Configure meson
        shell: bash
        run: |
            if [[ ${{matrix.arch}} == linux-x86 ]]; then
              CXX=clang CXX_LD=lld meson setup ${{matrix.arch}}
            elif [[ ${{matrix.arch}} == linux-x86-gcc ]]; then
              CXX=gcc CXX_LD=gold meson setup ${{matrix.arch}}
            elif [[ ${{matrix.arch}} == linux-x86-nosimd ]]; then
              CXX=gcc CXX_LD=gold meson setup ${{matrix.arch}} -Dnosimd=true
            elif [[ ${{matrix.arch}} == linux-amd64 ]]; then
              CXX=clang CXX_LD=lld meson setup ${{matrix.arch}} -D64bit=true
            elif [[ ${{matrix.arch}} == linux-arm64 ]]; then
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}} -Db_lto=false
            elif [[ ${{matrix.arch}} == windows-amd64 ]]; then
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}} -D64bit=true
            elif [[ ${{matrix.arch}} == apple-x86 ]]; then
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}} -Db_lto=false
            else
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}}
            fi
      - name: Build sources
        shell: bash
        run: |
          meson compile -C ${{matrix.arch}} -v
          echo "artifcat=${{matrix.arch}}/`ls ${{matrix.arch}}/ | egrep '^yapb*.*(so|dylib|dll)$' | head -1`" >> $GITHUB_ENV
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{matrix.arch}}
          path: ${{env.artifcat}}

  bot-msvc:
    if: github.event_name == 'workflow_dispatch' && inputs.build_target == 'full'
    needs: [unit-tests]
    permissions:
      contents: read
    env:
      name: windows-x86-msvc
      SCCACHE_GHA_ENABLED: "true"

    strategy:
      matrix:
        arch: ['windows-x86', 'windows-x86-msvc-xp']
      fail-fast: false

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup msbuild
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: amd64_x86
      - name: Install meson
        run: |
          python -m pip install --upgrade meson ninja
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Configure meson
        shell: pwsh
        run: |
          $nativeFile = Join-Path $env:RUNNER_TEMP "aipb-sccache-native.ini"
          @(
            '[binaries]'
            "cpp = ['sccache', 'cl.exe']"
          ) | Set-Content -Path $nativeFile -Encoding ascii

          if ('${{matrix.arch}}' -eq 'windows-x86-msvc-xp') {
            meson setup ${{matrix.arch}} --native-file $nativeFile -Dwinxp=true
          }
          else {
            meson setup ${{matrix.arch}} --native-file $nativeFile
          }
      - name: Build sources
        run: |
          meson compile -C ${{matrix.arch}} -v
      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{matrix.arch}}
          path: |
            ${{matrix.arch}}/yapb.dll

  bot-windows-x86:
    name: bot-windows-x86
    if: github.event_name == 'workflow_dispatch' && inputs.build_target == 'windows-x86'
    needs: [unit-tests]
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup msbuild
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: amd64_x86
      - name: Install meson
        run: |
          python -m pip install --upgrade meson ninja
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"
      - name: Configure meson
        shell: pwsh
        run: |
          $nativeFile = Join-Path $env:RUNNER_TEMP "aipb-sccache-native.ini"
          @(
            '[binaries]'
            "cpp = ['sccache', 'cl.exe']"
          ) | Set-Content -Path $nativeFile -Encoding ascii
          meson setup windows-x86 --native-file $nativeFile
      - name: Build sources
        run: meson compile -C windows-x86 -v
      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x86
          path: windows-x86/yapb.dll

  bot-apple:
    if: github.event_name == 'workflow_dispatch' && inputs.build_target == 'full'
    needs: [unit-tests]
    env:
      name: apple-arm64

    strategy:
      matrix:
        arch: ['apple-arm64']
      fail-fast: false

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install meson
        run: |
          python -m pip install --upgrade meson ninja
      - name: Configure meson
        run: |
          meson setup ${{matrix.arch}}
      - name: Build sources
        run: |
          meson compile -C ${{matrix.arch}} -v
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{matrix.arch}}
          path: |
            ${{matrix.arch}}/yapb*.dylib

  bot-continuous-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    name: bot-continuous-release
    runs-on: ubuntu-latest
    needs: [bot-build, bot-msvc, bot-apple]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
      - name: Get artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Configure meson
        run: |
          python -m pip install --upgrade meson ninja requests
      - name: Create packages
        run: |
          meson setup dist
          ninja -C dist package
        env:
          CS_CERTIFICATE: ${{secrets.CS_CERTIFICATE}}
          CS_CERTIFICATE_PASSWORD: ${{secrets.CS_CERTIFICATE_PASSWORD}}
      - name: Purge old build
        continue-on-error: true
        run: gh release delete continuous --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Very important stage
        continue-on-error: true
        run: |
          sleep 20s
      - name: Push new build
        run: gh release create continuous --generate-notes --prerelease --title "Continuous Build" ./pkg/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bot-release:
    if: |
      github.event_name == 'release' &&
      github.event.action == 'published'

    name: bot-release
    runs-on: ubuntu-latest
    needs: [bot-build, bot-msvc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
      - name: Get artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Configure meson
        run: |
          python -m pip install --upgrade meson ninja requests
      - name: Create packages
        run: |
          meson setup dist
          ninja -C dist package
        env:
          CS_CERTIFICATE: ${{secrets.CS_CERTIFICATE}}
          CS_CERTIFICATE_PASSWORD: ${{secrets.CS_CERTIFICATE_PASSWORD}}
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pkg/*
        env:
          GITHUB_TOKEN: ${{secrets.API_TOKEN}}
