name: build

on:
  push:
    branches:
      - master
      - dev
      - 'ai/**'
    paths-ignore:
      - '**.md'

  workflow_dispatch:

  release:
    types: [published]

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: AI unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install build tools
        run: |
          python -m pip install --upgrade meson ninja
      - name: Configure test build
        run: meson setup unit-tests -D64bit=true -Dtests=true
      - name: Run unit tests
        run: |
          meson test -C unit-tests --print-errorlogs --verbose
          file unit-tests/yapb_ai_tests

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meson-test-logs
          path: unit-tests/meson-logs/testlog.txt

  changes:
    name: Detect training-tools changes
    runs-on: ubuntu-latest
    outputs:
      training-tools: ${{ steps.filter.outputs.training-tools }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed training files
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "release" ]]; then
            echo "training-tools=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          if grep -q '^tools/aipb_training/' <<< "$changed_files"; then
            echo "training-tools=true" >> "$GITHUB_OUTPUT"
          else
            echo "training-tools=false" >> "$GITHUB_OUTPUT"
          fi

  training-tools:
    name: Training tools tests
    needs: [unit-tests, changes]
    if: needs.unit-tests.result == 'success' && needs.changes.outputs.training-tools == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: tools/aipb_training/requirements.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade -r tools/aipb_training/requirements.txt
      - name: Run training tool tests
        run: |
          set -o pipefail
          python -m unittest discover -s tools/aipb_training/tests -t . -p 'test_*.py' 2>&1 | tee python-test.log

      - name: Upload Python Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-test-logs
          path: python-test.log

  bot-build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.event_name == 'release'
    needs: [unit-tests]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yapb/builder:latest
      options: --hostname github-actions

    strategy:
      matrix:
        arch: ['linux-x86', 'linux-amd64', 'linux-x86-gcc', 'linux-x86-nosimd', 'linux-arm64', 'linux-riscv64', 'apple-x86', 'windows-x86-clang', 'windows-amd64', 'windows-x86-gcc']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Configure meson
        shell: bash
        run: |
            if [[ ${{matrix.arch}} == linux-x86 ]]; then
              CXX=clang CXX_LD=lld meson setup ${{matrix.arch}}
            elif [[ ${{matrix.arch}} == linux-x86-gcc ]]; then
              CXX=gcc CXX_LD=gold meson setup ${{matrix.arch}}
            elif [[ ${{matrix.arch}} == linux-x86-nosimd ]]; then
              CXX=gcc CXX_LD=gold meson setup ${{matrix.arch}} -Dnosimd=true
            elif [[ ${{matrix.arch}} == linux-amd64 ]]; then
              CXX=clang CXX_LD=lld meson setup ${{matrix.arch}} -D64bit=true
            elif [[ ${{matrix.arch}} == linux-arm64 ]]; then
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}} -Db_lto=false
            elif [[ ${{matrix.arch}} == windows-amd64 ]]; then
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}} -D64bit=true
            elif [[ ${{matrix.arch}} == apple-x86 ]]; then
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}} -Db_lto=false
            else
              meson setup ${{matrix.arch}} --cross-file ${{matrix.arch}}
            fi
      - name: Build sources
        shell: bash
        run: |
          meson compile -C ${{matrix.arch}} -v
          echo "artifcat=${{matrix.arch}}/`ls ${{matrix.arch}}/ | egrep '^yapb*.*(so|dylib|dll)$' | head -1`" >> $GITHUB_ENV
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{matrix.arch}}
          path: ${{env.artifcat}}

  bot-msvc:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.event_name == 'release'
    needs: [unit-tests]
    env:
      name: windows-x86-msvc

    strategy:
      matrix:
        arch: ['windows-x86', 'windows-x86-msvc-xp']
      fail-fast: false

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup msbuild
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: amd64_x86
      - name: Install meson
        run: |
          python -m pip install --upgrade meson ninja
      - name: Configure meson
        shell: pwsh
        run: |
            if ('${{matrix.arch}}' -eq 'windows-x86-msvc-xp') {
              meson setup ${{matrix.arch}} -Dwinxp=true
            }
            else {
              meson setup ${{matrix.arch}}
            }
      - name: Build sources
        run: |
          meson compile -C ${{matrix.arch}} -v
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{matrix.arch}}
          path: |
            ${{matrix.arch}}/yapb.dll

  bot-apple:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.event_name == 'release'
    needs: [unit-tests]
    env:
      name: apple-arm64

    strategy:
      matrix:
        arch: ['apple-arm64']
      fail-fast: false

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install meson
        run: |
          python -m pip install --upgrade meson ninja
      - name: Configure meson
        run: |
          meson setup ${{matrix.arch}}
      - name: Build sources
        run: |
          meson compile -C ${{matrix.arch}} -v
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{matrix.arch}}
          path: |
            ${{matrix.arch}}/yapb*.dylib

  bot-continuous-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    name: bot-continuous-release
    runs-on: ubuntu-latest
    needs: [bot-build, bot-msvc, bot-apple]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
      - name: Get artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Configure meson
        run: |
          python -m pip install --upgrade meson ninja requests
      - name: Create packages
        run: |
          meson setup dist
          ninja -C dist package
        env:
          CS_CERTIFICATE: ${{secrets.CS_CERTIFICATE}}
          CS_CERTIFICATE_PASSWORD: ${{secrets.CS_CERTIFICATE_PASSWORD}}
      - name: Purge old build
        continue-on-error: true
        run: gh release delete continuous --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Very important stage
        continue-on-error: true
        run: |
          sleep 20s
      - name: Push new build
        run: gh release create continuous --generate-notes --prerelease --title "Continuous Build" ./pkg/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bot-release:
    if: |
      github.event_name == 'release' &&
      github.event.action == 'published'

    name: bot-release
    runs-on: ubuntu-latest
    needs: [bot-build, bot-msvc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
      - name: Get artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Configure meson
        run: |
          python -m pip install --upgrade meson ninja requests
      - name: Create packages
        run: |
          meson setup dist
          ninja -C dist package
        env:
          CS_CERTIFICATE: ${{secrets.CS_CERTIFICATE}}
          CS_CERTIFICATE_PASSWORD: ${{secrets.CS_CERTIFICATE_PASSWORD}}
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pkg/*
        env:
          GITHUB_TOKEN: ${{secrets.API_TOKEN}}
