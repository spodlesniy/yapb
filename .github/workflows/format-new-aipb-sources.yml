name: format-new-aipb-sources

on:
  push:
    branches:
      - 'ai/phase-06-inference'

permissions:
  contents: write

jobs:
  format:
    name: Format new AiPB sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install format tools
        run: |
          python3 -m pipx ensurepath

      - name: Format new AiPB sources
        shell: bash
        run: |
          set -euo pipefail
          pipx run --spec clang-format==18.1.8 clang-format --version
          if ! pipx run --spec clang-format==18.1.8 clang-format --style=file --dump-config >/tmp/aipb-clang-format-config 2>/tmp/aipb-clang-format-error; then
            cat /tmp/aipb-clang-format-error
            cp /tmp/aipb-clang-format-error format-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add format-error.txt
            git commit -m "chore: capture formatter diagnostic"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit 1
          fi
          find inc/ai src/ai tests/unit -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
            -print0 | xargs -0 pipx run --spec clang-format==18.1.8 clang-format -i --style=file

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          find inc/ai src/ai tests/unit -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
            -print0 | xargs -0 -n1 pipx run --spec clang-format==18.1.8 clang-format --dry-run --Werror --style=file

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add inc/ai src/ai tests/unit
          git commit -m "style: format new AiPB sources"
          git push origin HEAD:${GITHUB_REF_NAME}
