name: format-new-aipb-sources

on:
  push:
    branches:
      - 'ai/phase-06-inference'

permissions:
  contents: write

jobs:
  format:
    name: Format new AiPB sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install format tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Configure compile database
        run: |
          meson setup format-build -D64bit=true -Dtests=true -Donnxruntime=false

      - name: Format new AiPB sources
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            {
              find inc/ai src/ai tests/unit -type f \\
                \\( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \\) \\
                | sort
            }
          )

          printf 'Formatting %s new AiPB source files...\\n' "${#files[@]}"
          clang-format --version

          for file in "${files[@]}"; do
            clang-format -i --style=file "$file"
          done

      - name: Apply configured clang-tidy fixes
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t cpp_files < <(
            {
              find inc/ai src/ai tests/unit -type f \\
                \\( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \\) \\
                | sort
            }
          )

          for file in "${cpp_files[@]}"; do
            clang-tidy "$file" -p format-build \\
              --header-filter='(^|/)(inc/ai|src/ai|tests/unit)/' \\
              --fix-errors --fix-notes --quiet || true
          done

          for file in inc/ai src/ai tests/unit; do
            if [ -d "$file" ]; then
              find "$file" -type f \\
                \\( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \\) \\
                -print0
            fi
          done | while IFS= read -r -d '' file; do
            clang-format -i --style=file "$file"
          done

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          mapfile -t files < <(
            {
              find inc/ai src/ai tests/unit -type f \\
                \\( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \\) \\
                | sort
            }
          )

          for file in "${files[@]}"; do
            clang-format --dry-run --Werror --style=file "$file"
          done

          if git diff --quiet; then
            exit 0
          fi

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add inc/ai src/ai tests/unit
          git commit -m "style: format new AiPB sources"
          git push origin HEAD:${GITHUB_REF_NAME}
